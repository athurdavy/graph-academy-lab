name: Validar laboratorios Python
on:
  push:
    paths:
      - 'laboratorios/**'
      - 'ejemplos/ontologias/**'
      - 'ejemplos/neo4j/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'laboratorios/**'
      - 'ejemplos/ontologias/**'
      - 'ejemplos/neo4j/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            laboratorios/requirements.txt
            ejemplos/neo4j/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r laboratorios/requirements.txt -r ejemplos/neo4j/requirements.txt
      - name: Comprobar pruebas locales
        run: python -m pytest laboratorios/tests -q
      - name: Comprobar cliente Neo4j sin conexión externa
        run: python -m pytest ejemplos/neo4j/tests -q
      - name: Comprobar validación RDF SHACL
        run: python ejemplos/ontologias/validar.py
