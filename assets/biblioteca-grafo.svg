<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="t d"><title id="t">Grafo de una biblioteca digital ficticia</title><desc id="d">Marina Soler escribió El mapa de los grafos; el libro trata sobre Grafos; un lector lo leyó.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#c0cde1"/></marker></defs><rect width="1100" height="560" rx="20" fill="#0c1425"/><g font-family="Arial,sans-serif"><text x="42" y="55" font-size="30" fill="#f0f5ff" font-weight="bold">Biblioteca digital · grafo de propiedades</text><text x="42" y="85" font-size="18" fill="#b8c8df">Dataset ficticio y público para practicar Neo4j, Cypher y Python</text><g stroke="#c0cde1" stroke-width="4" fill="none" marker-end="url(#arrow)"><path d="M310 225L430 225"/><path d="M716 225L825 225"/><path d="M312 425L430 270"/></g><g stroke-width="3"><rect x="58" y="170" width="255" height="110" rx="18" fill="#175b73" stroke="#65c8e8"/><rect x="430" y="170" width="285" height="110" rx="18" fill="#174a82" stroke="#78b6ff"/><rect x="826" y="170" width="224" height="110" rx="18" fill="#116a5b" stroke="#62d7bc"/><rect x="58" y="385" width="255" height="110" rx="18" fill="#6a447e" stroke="#d8a7ed"/></g><g fill="#fff" text-anchor="middle"><text x="185" y="207" font-size="17">:Autor</text><text x="185" y="242" font-size="25" font-weight="bold">Marina Soler</text><text x="573" y="207" font-size="17">:Libro</text><text x="573" y="240" font-size="22" font-weight="bold">El mapa de los grafos</text><text x="938" y="207" font-size="17">:Tema</text><text x="938" y="242" font-size="25" font-weight="bold">Grafos</text><text x="185" y="423" font-size="17">:Lector</text><text x="185" y="457" font-size="25" font-weight="bold">lector_demo</text></g><g fill="#e6efff" font-size="18" font-weight="bold" text-anchor="middle"><text x="372" y="203">ESCRIBIO</text><text x="770" y="203">TRATA_SOBRE</text><text x="380" y="344">LEYO</