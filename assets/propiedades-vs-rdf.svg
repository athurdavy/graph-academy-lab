<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img" aria-labelledby="title"><title id="title">Comparación grafo de propiedades y triple RDF</title><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6Z" fill="#b1c2de"/></marker></defs><rect width="1100" height="590" rx="22" fill="#0c1425"/><g font-family="Arial,sans-serif"><text x="40" y="57" fill="#f0f5ff" font-size="31" font-weight="bold">La misma idea, dos representaciones</text><text x="45" y="111" fill="#77d8c1" font-size="25" font-weight="bold">Grafo de propiedades</text><text x="595" y="111" fill="#85b6ff" font-size="25" font-weight="bold">RDF: triple sujeto-predicado-objeto</text><line x1="555" y1="85" x2="555" y2="550" stroke="#34445f" stroke-width="2"/>
<rect x="45" y="155" width="180" height="105" rx="18" fill="#155f54" stroke="#68d9bc" stroke-width="3"/><text x="135" y="197" fill="#fff" font-size="22" text-anchor="middle" font-weight="bold">Ana</text><text x="135" y="226" fill="#c2f7e8" font-size="17" text-anchor="middle">:Persona</text>
<rect x="338" y="155" width="180" height="105" rx="18" fill="#1b5088" stroke="#75b2ff" stroke-width="3"/><text x="428" y="197" fill="#fff" font-size="22" text-anchor="middle" font-weight="bold">Ventas</text><text x="428" y="226" fill="#d7e8ff" font-size="17" text-anchor="middle">:Departamento</text><line x1="225" y1="208" x2="338" y2="208" stroke="#b1c2de" stroke-width="4" marker-end="url(#arr)"/><rect x="225" y="166" width="113" height="29" rx="7" fill="#283f63"/><text x="282" y="186" fill="#fff" font-size="14" text-anchor="middle">PERTENECE_A</text>
<text x="45" y="329" fill="#e7f0ff" font-size="19">(:Persona {nombre: "Ana"})</text><text x="45" y="368" fill="#e7f0ff" font-size="19">-[:PERTENECE_A]-&gt;</text><text x="45" y="407" fill="#e7f0ff" font-size="19">(:Departamento {nombre: "Ventas"})</text><text x="45" y="483" fill="#a9bdd8" font-size="18">Nodos y relaciones pueden</text><text x="45" y="511" fill="#a9bdd8" font-size="18">tener propiedades.</text>
<rect x="596" y="158" width="460" height="64" rx="14" fill="#183151" stroke="#79adf2"/><text x="826" y="198" fill="#fff" font-size="23" text-anchor="middle">ex:ana</text><text x="826" y="259" fill="#a9bdd8" font-size="18" text-anchor="middle">sujeto</text>
<rect x="596" y="287" width="460" height="64" rx="14" fill="#23445d" stroke="#77d8c1"/><text x="826" y="327" fill="#fff" font-size="23" text-anchor="middle">ex:perteneceA</text><text x="826" y="387" fill="#a9bdd8" font-size="18" text-anchor="middle">predicado</text>
<rect x="596" y="415" width="460" height="64" rx="14" fill="#183151" stroke="#79adf2"/><text x="826" y="455" fill="#fff" font-size="23" text-anchor="middle">ex:ventas</text><text x="826" y="514" fill="#a9bdd8" font-size="18" text-anchor="middle">objeto</text><text x="595" y="556" fill="#b9c9e0" font-size="16">ex:ana ex:perteneceA ex:ventas .</text></g></svg>