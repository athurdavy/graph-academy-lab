<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc"><title id="title">Ejemplo didáctico de rutas y costes</title><desc id="desc">Desde A hasta D hay dos rutas. La superior A B D tiene dos saltos y coste 20. La inferior A C E D tiene tres saltos y coste 3.</desc><rect width="1100" height="580" rx="20" fill="#0b1727"/><g font-family="Arial,sans-serif"><text x="36" y="56" font-size="31" font-weight="bold" fill="#f4f9ff">Un mismo grafo, dos formas de elegir una ruta</text><text x="36" y="88" font-size="19" fill="#b9cadf">De A a D: BFS busca menos saltos; Dijkstra busca menor coste total.</text><g stroke-width="5" fill="none" stroke-linecap="round"><path d="M170 251 L473 167 L906 251" stroke="#f4b968"/><path d="M170 251 L478 397 L680 397 L906 251" stroke="#74dbc1"/></g><g fill="#fff" font-size="20" font-weight="bold" text-anchor="middle"><text x="310" y="182">coste 10</text><text x="717" y="171">coste 10</text><text x="305" y="353">coste 1</text><text x="575" y="379">coste 1</text><text x="807" y="351">coste 1</text></g><g stroke-width="3"><circle cx="170" cy="251" r="45" fill="#244c73" stroke="#a6cafa"/><circle cx="473" cy="167" r="45" fill="#795931" stroke="#f4b968"/><circle cx="478" cy="397" r="45" fill="#1d6e63" stroke="#74dbc1"/><circle cx="680" cy="397" r="45" fill="#1d6e63" stroke="#74dbc1"/><circle cx="906" cy="251" r="45" fill="#244c73" stroke="#a6cafa"/></g><g fill="#fff" font-size="30" font-weight="bold" text-anchor="middle" dominant-baseline="central"><text x="170" y="251">A</text><text x="473" y="167">B</text><text x="478" y="397">C</text><text x="680" y="397">E</text><text x="906" y="251">D</text></g><rect x="45" y="484" width="475" height="67" rx="11" fill="#382e26" stroke="#d6ab70"/><rect x="554" y="484" width="500" height="67" rx="11" fill="#173d39" stroke="#70d4bd"/><text x="62" y="512" fill="#fff" font-size="20" font-weight="bold">Ruta A → B → D</text><text x="62" y="537" fill="#f0d1a4" font-size="17">2 saltos · coste 10 + 10 = 20</text><text x="571" y="512" fill="#fff" font-size="20" font-weight="bold">Ruta A → C → E → D</text><text x="571" y="537" fill="#b2eadd" font-size="17">3 saltos · coste 1 + 1 + 1 = 3</text></g></svg>