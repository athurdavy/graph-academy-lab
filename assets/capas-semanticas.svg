<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" role="img" aria-labelledby="title"><title id="title">Diferencias entre RDF SKOS OWL y SHACL</title><rect width="1080" height="480" rx="24" fill="#0c1425"/><g font-family="Arial,sans-serif"><text x="35" y="54" font-size="31" font-weight="bold" fill="#fff">RDF, SKOS, OWL y SHACL: responsabilidades diferentes</text><g stroke-width="3"><rect x="40" y="98" width="230" height="250" rx="20" fill="#174a82" stroke="#7baeff"/><rect x="295" y="98" width="230" height="250" rx="20" fill="#126c63" stroke="#6ee1bc"/><rect x="550" y="98" width="230" height="250" rx="20" fill="#634578" stroke="#d6a9f4"/><rect x="805" y="98" width="230" height="250" rx="20" fill="#76502e" stroke="#efd09a"/></g><g text-anchor="middle" fill="white"><text x="155" y="160" font-size="31" font-weight="bold">RDF</text><text x="155" y="208" font-size="20">Triples</text><text x="155" y="240" font-size="20">sujeto</text><text x="155" y="267" font-size="20">predicado</text><text x="155" y="294" font-size="20">objeto</text><text x="410" y="160" font-size="31" font-weight="bold">SKOS</text><text x="410" y="207" font-size="20">Conceptos</text><text x="410" y="239" font-size="20">Etiquetas</text><text x="410" y="271" font-size="20">Jerarquías</text><text x="665" y="160" font-size="31" font-weight="bold">OWL</text><text x="665" y="207" font-size="20">Clases</text><text x="665" y="239" font-size="20">Axiomas</text><text x="665" y="271" font-size="20">Inferencias</text><text x="920" y="160" font-size="31" font-weight="bold">SHACL</text><text x="920" y="207" font-size="20">Formas</text><text x="920" y="239" font-size="20">Reglas de calidad</text><text x="920" y="271" font-size="20">Informe</text></g><text x="40" y="401" fill="#cbd6e7" font-family="Arial,sans-serif" font-size="21">SPARQL consulta RDF. OWL describe inferencias. SHACL comprueba condiciones.</text><text x="40" y="437" fill="#a8bcdb" font-family="Arial,sans-serif" font-size="17">Ilustración didáctica original · Graph Academy Lab</text></g></svg>