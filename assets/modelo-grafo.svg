<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">Grafo de conceptos, instancias y relaciones</title><desc id="desc">Empleado es subtipo de Persona, Ana es instancia de Empleado, Ana pertenece a Ventas y trabaja en Proyecto Atlas</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#7c8fb1"/></marker><style>text{font-family:Arial,sans-serif}.node{stroke-width:3}.lbl{fill:#e9f2ff;font-size:25px;font-weight:bold;text-anchor:middle}.small{fill:#b8c8df;font-size:18px;text-anchor:middle}.rel{fill:#0c1730;stroke:#537098;stroke-width:2}.reltext{fill:#e9f2ff;font-size:16px;font-weight:bold;text-anchor:middle}</style></defs><rect width="1100" height="610" rx="22" fill="#0c1425"/><text x="45" y="55" fill="#f0f5ff" font-size="31" font-weight="bold">Modelo de un dominio: conceptos frente a instancias</text><text x="45" y="87" fill="#b8c8df" font-size="18">Las flechas tienen significado y dirección: no son conexiones intercambiables.</text>
