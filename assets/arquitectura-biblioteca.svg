<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 550" role="img" aria-labelledby="title"><title id="title">Arquitectura de aplicación Python con Neo4j y PostgreSQL opcional</title><rect width="1080" height="550" rx="24" fill="#0c1425"/><g font-family="Arial,sans-serif"><text x="39" y="55" fill="white" font-size="32" font-weight="bold">Arquitectura de una biblioteca digital ficticia</text><text x="39" y="87" fill="#bad0e6" font-size="20">Una BBDD puede bastar; PostgreSQL es opcional</text><g fill="none" stroke="#b9c8db" stroke-width="4"><path d="M540 184V218"/><path d="M540 296V343H265V379"/><path d="M540 343H815V379"/></g><g stroke-width="3"><rect x="371" y="117" width="338" height="67" rx="14" fill="#174a82" stroke="#7aaaff"/><rect x="371" y="218" width="338" height="78" rx="14" fill="#234a63" stroke="#78c8f2"/><rect x="90" y="379" width="350" height="105" rx="15" fill="#116a5b" stroke="#76e5bf"/><rect x="640" y="379" width="350" height="105" rx="15" fill="#604376" stroke="#d3a9eb"/></g><g text-anchor="middle" fill="white"><text x="540" y="159" font-size="26" font-weight="bold">API / CLI Python</text><text x="540" y="250" font-size="23" font-weight="bold">Servicios + repositorios</text><text x="540" y="278" font-size="18">reglas de negocio y acceso a datos</text><text x="265" y="422" font-size="28" font-weight="bold">Neo4j</text><text x="265" y="457" font-size="19">Relaciones y recorridos</text><text x="815" y="422" font-size="28" font-weight="bold">PostgreSQL</text><text x="815" y="457" font-size="19">Opcional: datos relacionales</text></g><text x="40" y="525" fill="#b9c9e1" font-size="18">RDF, OWL y SHACL forman otra dimensión: semántica y validación del conocimiento.</text></g></svg>